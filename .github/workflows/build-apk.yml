name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "beta*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage HabitTracker.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HabitTracker.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-debug-apk
          path: HabitTracker.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/beta')
        uses: softprops/action-gh-release@v2
        with:
          files: HabitTracker.apk
          name: beta 2.0 Lez
          body: |
            ## 🫧 Neumorphic Habit Tracker — beta 2.0 Lez

            ### What's New in beta 2.0:
            - **Google & GitHub Authentication**: Sign in with Google, GitHub, Email/Password, or continue in Guest mode with local storage.
            - **Verified Real JSON Export & Import**:
              - Reliable cross-platform file download with fallback.
              - 1-Click "Copy JSON to Clipboard".
              - Direct "Paste JSON Text" import drawer for devices with restrictive file pickers.
              - Strict schema validation with habit & log counts reported.
            - **High-Fidelity Real Print & PDF Engine**:
              - Dedicated printable document layout for `window.print()` with clean typography, executive KPI summary table, high-contrast calendar grid, and habit breakdown table.
              - Standalone downloadable printable HTML report (`.html`) ready to open in any browser or save to PDF offline.
            - **Tactile Neumorphic (Soft UI)**: Light and Dark mode with realistic debossed and embossed soft shadows.
            - **Zero Pre-existing Habits**: Clean slate for the user. No mock habits or dummy tracking data.
            - **Android APK**: Download and install `HabitTracker.apk` directly on Android devices.
          generate_release_notes: false
