name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage HabitTracker.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HabitTracker.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-debug-apk
          path: HabitTracker.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HabitTracker.apk
          name: Habit Tracker ${{ github.ref_name }}
          body: |
            ## 🫧 Neumorphic Habit Tracker

            ### Highlights:
            - **Tactile Neumorphic (Soft UI)**: Light and Dark mode with realistic debossed and embossed soft shadows.
            - **Zero Pre-existing Habits**: Clean slate for the user. No mock habits or dummy tracking data.
            - **Daily Habit Tracking**: 7-day pill carousel, real-time momentum progress bar with celebration confetti, completion notes.
            - **Monthly Report & Heatmap**: 7-column calendar grid with color intensity levels, completion KPIs, day-by-day inspector, per-habit breakdown, Markdown export, and Print/PDF export.
            - **Local Data Persistence**: 100% offline, privacy-first, with JSON backup export and import.
            - **Android APK**: Download and install `HabitTracker.apk` directly on Android devices.
          generate_release_notes: false
